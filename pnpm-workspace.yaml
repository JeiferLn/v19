packages:
  - "apps/*"
  - "packages/*"

# Scripts de instalación de dependencias (pnpm >= 10 los bloquea por defecto).
# Lista explícita: solo se habilita lo que de verdad lo necesita. Revisar con `pnpm ignored-builds`.
# - sharp 0.35 y unrs-resolver 1.13 no tienen script install/postinstall: usan binarios precompilados
#   (@img/sharp-*, @unrs/resolver-binding-*) y cargan correctamente sin ejecutar nada → se quedan en false.
# Nota: la configuración de pnpm (nodeLinker, etc.) va en este archivo; .npmrc solo se usa para auth.
allowBuilds:
  sharp: false
  unrs-resolver: false

minimumReleaseAgeExclude:
  - "@supabase/auth-js@2.119.1"
  - "@supabase/functions-js@2.119.1"
  - "@supabase/postgrest-js@2.119.1"
  - "@supabase/realtime-js@2.119.1"
  - "@supabase/storage-js@2.119.1"
  - "@supabase/supabase-js@2.119.1"
  - "@turbo/darwin-64@2.11.13"
  - "@turbo/darwin-arm64@2.11.13"
  - "@turbo/linux-64@2.11.13"
  - "@turbo/linux-arm64@2.11.13"
  - "@turbo/windows-64@2.11.13"
  - "@turbo/windows-arm64@2.11.13"
  - turbo@2.11.13
