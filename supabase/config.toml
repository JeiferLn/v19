# Configuración mínima del entorno local de Supabase (`supabase start`).
# Referencia completa: https://supabase.com/docs/guides/local-development/cli/config
project_id = "v19"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
# Debe coincidir con la versión de Postgres del proyecto remoto (17 por defecto en proyectos nuevos).
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

# Servidor SMTP local para ver los correos de Auth (antes [inbucket])
[local_smtp]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000", "v19://"]
jwt_expiry = 3600
enable_signup = true
# Alineado con loginSchema de @v19/validators (password.min(8)).
minimum_password_length = 8

[auth.email]
enable_signup = true
enable_confirmations = false
